<script>
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault(); 
        });

        document.addEventListener('keydown', (e) => {
            if (
                e.ctrlKey && (e.key === 'u' || e.key === 'U') ||  
                e.key === 'F12' ||                             
                (e.ctrlKey && e.shiftKey && e.key === 'I') ||     
                (e.metaKey && e.altKey && e.key === 'I')          
            ) {
                e.preventDefault(); 
            }
        });
</script>

    /* PANTALLA 1: PÍLDORA FLOTANTE */
    .pill-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: clamp(340px, 92vw, 540px);
      cursor: pointer;
      animation: levitateWidget 4.2s ease-in-out infinite alternate;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), filter 0.25s ease;
    }

    .pill-wrapper:hover {
      transform: translateY(-8px) scale(1.018);
      filter: brightness(1.08);
    }

    .pill-wrapper:active {
      transform: translateY(-2px) scale(0.985);
    }

    @keyframes levitateWidget {
      0% {
        transform: translateY(0px) rotate(0deg);
        filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.7));
      }
      50% {
        transform: translateY(-9px) rotate(-0.25deg);
        filter: drop-shadow(0 20px 34px rgba(0, 0, 0, 0.85));
      }
      100% {
        transform: translateY(-14px) rotate(0.25deg);
        filter: drop-shadow(0 28px 44px rgba(0, 0, 0, 0.95));

    .floating-pill {
      display: flex;

      <!-- ==========================================================

  <!-- Audio elemento DropBox -->
  <audio id="audioPlayer" preload="auto"></audio>

  <!-- Toast flotante -->
  <div class="toast-popup" id="toastBox">Notificación</div>

  <script>
    lucide.createIcons();

    // ==========================================
    // ENLACE DIRECTO DE DROPBOX
    // ==========================================
    const DROPBOX_AUDIO_URL = "https://www.dropbox.com/scl/fi/prxjt2m0n765mkv9ks873/Irme-Lejos.mp3?rlkey=a89pdle2i40hitp2rmpw5cj63&st=t6g8w1b2&dl=0";

    function formatDropboxDirectUrl(url) {
      if (!url) return "";
      return url.replace("&dl=0", "&raw=1").replace("?dl=0", "?raw=1");
    }

    const audioPlayer = document.getElementById('audioPlayer');
    audioPlayer.src = formatDropboxDirectUrl(DROPBOX_AUDIO_URL);

    // Referencias del DOM
    const openTrigger = document.getElementById('openProfileTrigger');
    const closeTrigger = document.getElementById('closeProfileTrigger');
    const modalOverlay = document.getElementById('profileModalOverlay');
    const bellBtn = document.getElementById('bellButton');
    const toast = document.getElementById('toastBox');

    // Controles de Audio Spotify
    const playToggle = document.getElementById('musicPlayToggle');
    const playIcon = document.getElementById('musicPlayIcon');
    const progressFill = document.getElementById('trackProgressFill');
    const timeline = document.getElementById('trackTimeline');
    const timeDisplay = document.getElementById('audioCurrent');
    const totalDisplay = document.getElementById('audioTotal');

    let toastTimeout;
    function showToast(msg) {
      clearTimeout(toastTimeout);
      toast.textContent = msg;
      toast.classList.add('visible');
      toastTimeout = setTimeout(() => {
        toast.classList.remove('visible');
      }, 2500);
    }

    // Reproducción
    function playAudioTrack() {
      const playPromise = audioPlayer.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          showToast('Reproduciendo: Airbag - Irme Lejos');
        }).catch(err => {
          console.warn('Autoplay prevenido:', err);
        });
      }
    }

    // Pausa
    function pauseAudioTrack() {
      if (!audioPlayer.paused) {
        audioPlayer.pause();
      }
    }

    // Auto-reproducción al entrar a la pantalla 2
    openTrigger.addEventListener('click', () => {
      modalOverlay.classList.add('active');
      playAudioTrack();
    });

    // Pausar si se cierra la pantalla 2
    function closeModal() {
      modalOverlay.classList.remove('active');
      pauseAudioTrack();
    }

    closeTrigger.addEventListener('click', closeModal);

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        closeModal();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
        closeModal();
      }
    });

    bellBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      showToast('No tienes notificaciones pendientes');
    });

    // Formatear segundos a mm:ss
    function formatTime(sec) {
      if (isNaN(sec) || !isFinite(sec)) return "00:00";
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(Math.floor(sec % 60)).padStart(2, '0');
      return `${m}:${s}`;
    }

    // Play / Pausa manual en el botón de Spotify
    playToggle.addEventListener('click', () => {
      if (audioPlayer.paused) {
        playAudioTrack();
      } else {
        pauseAudioTrack();
        showToast('Spotify en pausa');
      }
    });

    audioPlayer.addEventListener('play', () => {
      playIcon.setAttribute('data-lucide', 'pause');
      lucide.createIcons();
    });

    audioPlayer.addEventListener('pause', () => {
      playIcon.setAttribute('data-lucide', 'play');
      lucide.createIcons();
    });

    audioPlayer.addEventListener('loadedmetadata', () => {
      totalDisplay.textContent = formatTime(audioPlayer.duration);
    });

    audioPlayer.addEventListener('timeupdate', () => {
      if (!audioPlayer.duration) return;
      const current = audioPlayer.currentTime;
      const total = audioPlayer.duration;
      timeDisplay.textContent = formatTime(current);
      const pct = (current / total) * 100;
      progressFill.style.width = pct + '%';
    });

    audioPlayer.addEventListener('ended', () => {
      progressFill.style.width = '0%';
      timeDisplay.textContent = "00:00";
      playIcon.setAttribute('data-lucide', 'play');
      lucide.createIcons();
    });

    // Clic en la barra para cambiar momento de la pista
    timeline.addEventListener('click', (e) => {
      if (!audioPlayer.duration) return;
      const rect = timeline.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = Math.max(0, Math.min(1, clickX / rect.width));
      audioPlayer.currentTime = ratio * audioPlayer.duration;
    });

    // Tabs
    document.querySelectorAll('.nav-tab-item').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.nav-tab-item').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
